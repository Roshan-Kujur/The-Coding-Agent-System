[project]
name = "the_coding_agent_system"
version = "0.1.0"
description = "the_coding_agent_system using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.4"
]

[project.scripts]
the_coding_agent_system = "the_coding_agent_system.main:run"
run_crew = "the_coding_agent_system.main:run"
train = "the_coding_agent_system.main:train"
replay = "the_coding_agent_system.main:replay"
test = "the_coding_agent_system.main:test"
run_with_trigger = "the_coding_agent_system.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
